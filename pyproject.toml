[project]
name = "llmops-kit"
version = "0.1.0"
description = "Shared tracing, eval and template tooling for LLM projects"
authors = [
    { name = "Manish Puri", email = "9772350+mpuri1@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "copier>=9.18.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
