# LiteLLM proxy: one OpenAI-compatible endpoint for every project.
#   uv run --extra gateway litellm --config gateway/config.yaml --port 4000
# Projects ask for an alias ("fast", "smart"), never a provider model name, so models can change here only.
# A model missing from LiteLLM's price table needs model_info: {input_cost_per_token, output_cost_per_token},
# or the budget hook refuses the project's calls after its first unpriced one.
model_list:
  - model_name: fast
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
  - model_name: smart
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GOOGLE_API_KEY
  - model_name: fallback
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY

  # Bedrock via bedrock-mantle (OpenAI-compatible, SigV4). LiteLLM can't sign, so it talks to the local signing proxy:
  #   BEDROCK_PROFILE=<your-aws-profile> uv run --extra bedrock python -m llmops_kit.bedrock_proxy
  # The Bedrock model id and prices (per token; $1.00 / $3.20 per 1M, AWS Bedrock pricing checked 2026-10-05) live here only.
  - model_name: bedrock-glm
    litellm_params:
      model: openai/zai.glm-5
      api_base: os.environ/BEDROCK_PROXY_URL   # e.g. http://127.0.0.1:4010/v1
      api_key: "unused-the-proxy-signs"
    model_info:
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.0000032

  # Azure OpenAI: a model deployment in an Azure AI Foundry resource. The endpoint, key, API version and the
  # deployment (as azure/<deployment-name>) all come from the environment; none of them is written here.
  #   AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY, AZURE_OPENAI_API_VERSION, AZURE_GATEWAY_MODEL
  # base_model tells LiteLLM which model the deployment serves (a custom deployment name hides it), so reasoning-model
  # parameters (no temperature, max_completion_tokens) are handled. Prices per token, Azure Retail Prices API,
  # checked 2026-10-09: $0.25 in / $2.00 out per 1M, cached input $0.025.
  - model_name: azure-gpt
    litellm_params:
      model: os.environ/AZURE_GATEWAY_MODEL
      api_base: os.environ/AZURE_OPENAI_ENDPOINT
      api_key: os.environ/AZURE_OPENAI_API_KEY
      api_version: os.environ/AZURE_OPENAI_API_VERSION
    model_info:
      base_model: azure/gpt-5-mini
      input_cost_per_token: 0.00000025
      output_cost_per_token: 0.000002
      cache_read_input_token_cost: 0.000000025

router_settings:
  num_retries: 2            # retried on 429 / 5xx before falling back
  timeout: 60
  fallbacks:
    - fast: [fallback]
    - smart: [fallback]

litellm_settings:
  drop_params: true
  callbacks: budget_hook.budgets   # per-project daily budgets + spend ledger

general_settings:
  master_key: os.environ/LLMOPS_GATEWAY_KEY
